name: Fabric 26.2 Smoke Test

# Boots a real Fabric 26.2 dedicated server with the freshly built GrimAC jar,
# alongside a modpack matching a reported production server, and checks that
# GrimAC loads and starts. It also crashes the server (kill -9) and restarts
# it immediately to make sure Grim recovers from an unclean shutdown.
on:
    workflow_dispatch:
    push:
        branches:
            - 'claude/**'

jobs:
    smoke-test:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read

        env:
            MC_VERSION: '26.2'
            LOADER_VERSION: '0.19.5'
            FABRIC_API_VERSION: '0.161.0+26.2'
            SQLITE_JDBC_VERSION: '3.46.1.3'
            # Modrinth slugs of other mods to load next to Grim (skipped if no 26.2 build exists).
            EXTRA_MODS: 'lithium c2me-fabric krypton ferrite-core modernfix vmp-fabric scalablelux spark simple-voice-chat yacl'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3
              with:
                  cache-read-only: true

            - name: Build GrimAC (Fabric)
              run: |
                  echo "GRIM_GIT_REPO=${{ github.event.repository.name }}" >> $GITHUB_ENV
                  echo "GRIM_GIT_ORG=${{ github.repository_owner }}" >> $GITHUB_ENV
                  ./gradlew :fabric:build

            - name: Prepare Fabric server
              run: |
                  set -euo pipefail
                  mkdir -p server/mods
                  INSTALLER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/installer" | jq -r '.[0].version')
                  curl -fsSL -o server/fabric-server.jar \
                      "https://meta.fabricmc.net/v2/versions/loader/${MC_VERSION}/${LOADER_VERSION}/${INSTALLER}/server/jar"
                  curl -fsSL -o "server/mods/fabric-api.jar" \
                      "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${FABRIC_API_VERSION}/fabric-api-${FABRIC_API_VERSION}.jar"
                  curl -fsSL -o server/sqlite-jdbc.jar \
                      "https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/${SQLITE_JDBC_VERSION}/sqlite-jdbc-${SQLITE_JDBC_VERSION}.jar"
                  cp fabric/build/libs/grimac-fabric-*.jar server/mods/

                  for slug in $EXTRA_MODS; do
                      url=$(curl -fsSL -G "https://api.modrinth.com/v2/project/${slug}/version" \
                              --data-urlencode "game_versions=[\"${MC_VERSION}\"]" \
                              --data-urlencode 'loaders=["fabric"]' 2>/dev/null \
                            | jq -r '[.[] | .files[] | select(.primary == true) | .url][0] // empty' || true)
                      if [[ -n "$url" ]]; then
                          curl -fsSL -o "server/mods/${slug}.jar" "$url" && echo "added $slug"
                      else
                          echo "skipped $slug (no ${MC_VERSION} fabric build found)"
                      fi
                  done
                  ls -la server/mods
                  echo "eula=true" > server/eula.txt
                  printf 'online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\n' > server/server.properties

            - name: Boot, crash and restart
              run: |
                  set -uo pipefail
                  cd server

                  boot() {
                      local name=$1
                      : > "cmd-$name.txt"
                      ( tail -f "cmd-$name.txt" | java -Xmx3G -cp fabric-server.jar:sqlite-jdbc.jar net.fabricmc.installer.ServerLauncher nogui > "log-$name.txt" 2>&1 ) &
                      local start=$(date +%s)
                      for i in $(seq 1 900); do
                          if grep -q 'Done (' "log-$name.txt"; then
                              echo "[$name] Done after $(( $(date +%s) - start ))s"
                              return 0
                          fi
                          if ! pgrep -f 'fabric-server.jar' > /dev/null && [[ $i -gt 10 ]]; then
                              echo "[$name] SERVER EXITED BEFORE STARTING"; return 1
                          fi
                          sleep 0.5
                      done
                      echo "[$name] TIMED OUT"; return 1
                  }

                  stop_clean() {
                      local name=$1
                      echo stop >> "cmd-$name.txt"
                      for i in $(seq 1 120); do pgrep -f 'fabric-server.jar' > /dev/null || break; sleep 0.5; done
                      pkill -9 -f 'fabric-server.jar' || true
                      pkill -f "tail -f cmd-$name.txt" || true
                  }

                  report() {
                      local name=$1
                      echo "----- [$name] mods -----"
                      grep -E '^\s+- ' "log-$name.txt" | head -40 || true
                      echo "----- [$name] GrimAC lines -----"
                      grep -E 'Loaded Fabric platform|Registering packets|Grim Version|grim-datastore\].*(complete|disabled|failed)|No Fabric platform entrypoint' "log-$name.txt" || true
                      echo "----- [$name] errors -----"
                      grep -E '/ERROR\]|Exception|SEVERE' "log-$name.txt" | head -40 || true
                      echo "----- [$name] full crash -----"
                      grep -A60 'A mod crashed on startup' "log-$name.txt" | grep -vE '^\s+at (java\.|jdk\.|net\.fabricmc\.loader)' | head -80 || true
                  }

                  status=0
                  boot first || status=1
                  sleep 20; report first
                  pkill -9 -f 'fabric-server.jar' || true; sleep 1; pkill -f 'tail -f cmd-first.txt' || true
                  echo "[first] killed with SIGKILL"

                  boot second || status=1
                  sleep 20; report second
                  stop_clean second

                  echo "===== RESULT ====="
                  for n in first second; do
                      grep -q 'Loaded Fabric platform' "log-$n.txt" && echo "[$n] GrimAC 26.x platform loaded" || { echo "[$n] GrimAC platform NOT loaded"; status=1; }
                      grep -q 'Registering packets' "log-$n.txt" && echo "[$n] GrimAC started" || { echo "[$n] GrimAC did NOT start"; status=1; }
                  done
                  exit $status

            - name: Bisect - boot GrimAC with each extra mod on its own
              if: always()
              run: |
                  set -uo pipefail
                  cd server
                  mkdir -p ../extra && mv mods/*.jar ../extra/ 2>/dev/null || true
                  cp ../extra/fabric-api.jar ../extra/grimac-fabric-*.jar mods/
                  try() {
                      local label=$1
                      ( java -Xmx3G -cp fabric-server.jar:sqlite-jdbc.jar net.fabricmc.installer.ServerLauncher nogui < /dev/null > "bisect-$label.txt" 2>&1 ) &
                      local result="TIMEOUT $label"
                      for i in $(seq 1 240); do
                          grep -q 'Done (' "bisect-$label.txt" && { result="OK      $label"; break; }
                          grep -qE 'A mod crashed on startup|Incompatible mods found|Failed to start' "bisect-$label.txt" && {
                              result="CRASH   $label"; grep -E 'Caused by|Provider|provider' "bisect-$label.txt" | head -6 | sed 's/^/          /'; break; }
                          sleep 0.5
                      done
                      echo "$result"
                      pkill -9 -f 'fabric-server.jar' || true; sleep 1
                  }
                  try grim-only
                  for jar in ../extra/*.jar; do
                      b=$(basename "$jar")
                      [[ "$b" == fabric-api.jar || "$b" == grimac-fabric-* ]] && continue
                      cp "$jar" mods/
                      try "${b%.jar}"
                      rm -f "mods/$b"
                  done

            - name: Upload server logs
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: fabric-smoke-test-logs
                  path: |
                      server/log-*.txt
                      server/bisect-*.txt
                      server/logs/
                  if-no-files-found: warn
