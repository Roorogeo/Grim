name: Fabric 26.2 Smoke Test

# Boots a real Fabric 26.2 dedicated server with the freshly built GrimAC jar
# and checks that GrimAC starts. Then it simulates a crash (kill -9) and an
# immediate restart, which is the case where the previous run's datastore
# ownership lease is still live, to confirm startup no longer stalls on it.
on:
    workflow_dispatch:
    push:
        branches:
            - 'claude/**'

jobs:
    smoke-test:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read

        env:
            MC_VERSION: '26.2'
            FABRIC_API_VERSION: '0.152.1+26.2'

        steps:
            - name: Checkout repository with full history
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3
              with:
                  cache-read-only: true

            - name: Build with Gradle
              run: |
                  echo "GRIM_GIT_REPO=${{ github.event.repository.name }}" >> $GITHUB_ENV
                  echo "GRIM_GIT_ORG=${{ github.repository_owner }}" >> $GITHUB_ENV
                  ./gradlew build

            - name: Prepare Fabric server
              run: |
                  set -euo pipefail
                  mkdir -p server/mods
                  LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader/${MC_VERSION}" | jq -r '.[0].loader.version')
                  INSTALLER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/installer" | jq -r '.[0].version')
                  echo "Fabric loader $LOADER, installer $INSTALLER"
                  curl -fsSL -o server/fabric-server.jar \
                      "https://meta.fabricmc.net/v2/versions/loader/${MC_VERSION}/${LOADER}/${INSTALLER}/server/jar"
                  curl -fsSL -o "server/mods/fabric-api-${FABRIC_API_VERSION}.jar" \
                      "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${FABRIC_API_VERSION}/fabric-api-${FABRIC_API_VERSION}.jar"
                  cp fabric/build/libs/grimac-fabric-*.jar server/mods/
                  ls -la server/mods
                  echo "eula=true" > server/eula.txt
                  printf 'online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\n' > server/server.properties

            - name: Run boots (clean start, clean stop, crash, immediate restart)
              run: |
                  set -uo pipefail
                  cd server

                  # boot <name>: starts the server, waits for "Done (", leaves it running.
                  boot() {
                      local name=$1
                      : > "cmd-$name.txt"
                      ( tail -f "cmd-$name.txt" | java -Xmx2G -jar fabric-server.jar nogui > "log-$name.txt" 2>&1 ) &
                      echo $! > "pid-$name.txt"
                      local start=$(date +%s)
                      for i in $(seq 1 600); do
                          if grep -q 'Done (' "log-$name.txt"; then
                              echo "[$name] Done after $(( $(date +%s) - start ))s (wall clock)"
                              grep -o 'Done ([0-9.]*s)' "log-$name.txt" | head -1 | sed "s/^/[$name] server reports: /"
                              return 0
                          fi
                          if grep -qE 'Exception in server tick loop|Failed to start the minecraft server|Encountered an unexpected exception|Mixin apply.*failed|Incompatible mods found|Could not execute entrypoint' "log-$name.txt"; then
                              echo "[$name] SERVER FAILED TO START"
                              return 1
                          fi
                          sleep 0.5
                      done
                      echo "[$name] TIMED OUT waiting for Done"
                      return 1
                  }

                  graceful_stop() {
                      local name=$1
                      echo stop >> "cmd-$name.txt"
                      for i in $(seq 1 120); do
                          pgrep -f 'fabric-server.jar' > /dev/null || { echo "[$name] stopped cleanly"; return 0; }
                          sleep 0.5
                      done
                      echo "[$name] did not stop in time; killing"
                      pkill -9 -f 'fabric-server.jar' || true
                  }

                  crash() {
                      local name=$1
                      pkill -9 -f 'fabric-server.jar' || true
                      sleep 1
                      pkill -f "tail -f cmd-$name.txt" || true
                      echo "[$name] killed with SIGKILL"
                  }

                  summarize() {
                      local name=$1
                      echo "----- [$name] GrimAC / datastore lines -----"
                      grep -iE 'grim|packetevents|datastore|ownership lease|entrypoint' "log-$name.txt" | grep -viE 'debug' | head -60 || true
                      echo "----- [$name] errors -----"
                      grep -iE 'ERROR|Exception|SEVERE' "log-$name.txt" | head -40 || true
                  }

                  status=0

                  boot first || status=1
                  sleep 15
                  summarize first
                  graceful_stop first
                  pkill -f 'tail -f cmd-first.txt' || true

                  boot second || status=1
                  sleep 15
                  summarize second
                  crash second

                  # Restart immediately: the crashed run's ownership lease (20s TTL) is still live.
                  boot third || status=1
                  sleep 30
                  summarize third
                  graceful_stop third
                  pkill -f 'tail -f cmd-third.txt' || true

                  echo "===== RESULT ====="
                  for n in first second third; do
                      grep -q 'Loaded Fabric platform' "log-$n.txt" && echo "[$n] GrimAC platform loaded" || { echo "[$n] GrimAC platform NOT loaded"; status=1; }
                      grep -q 'Registering packets' "log-$n.txt" && echo "[$n] GrimAC started (packets registered)" || { echo "[$n] GrimAC did NOT start"; status=1; }
                  done
                  grep -q 'waiting .*ms for the ownership lease' log-third.txt \
                      && echo "[third] hit the live ownership lease (expected after a crash) - startup was not blocked by it" \
                      || echo "[third] did not hit a live ownership lease"
                  exit $status

            - name: Upload server logs
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: fabric-smoke-test-logs
                  path: |
                      server/log-*.txt
                      server/logs/
                  if-no-files-found: warn
