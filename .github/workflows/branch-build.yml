name: Branch Build (no publish)

# Builds the Bukkit and Fabric jars for feature branches and uploads them as
# workflow artifacts. Nothing is published to Modrinth or the update API.
on:
    workflow_dispatch:
    push:
        branches:
            - 'claude/**'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repository with full history
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3
              with:
                  cache-read-only: true

            - name: Set Git Environment Variables
              run: |
                  echo "GRIM_GIT_REPO=${{ github.event.repository.name }}" >> $GITHUB_ENV
                  echo "GRIM_GIT_ORG=${{ github.repository_owner }}" >> $GITHUB_ENV

            - name: Build with Gradle
              run: ./gradlew build

            - name: Upload Fabric Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: grimac-fabric
                  path: ${{ github.workspace }}/fabric/build/libs/grimac-fabric-*.jar
                  if-no-files-found: error

            - name: Upload Bukkit Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: grimac-bukkit
                  path: ${{ github.workspace }}/bukkit/build/libs/grimac-bukkit-*.jar
                  if-no-files-found: error
